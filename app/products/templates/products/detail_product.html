{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-title">product_details</div>
    <h1>{{ product.name }}</h1>
    <h3 style="color: var(--accent);">${{ product.price }}</h3>
    <p class="lead mt-4">{{ product.content }}</p>
    <a href="{{ url_for('products.list_products') }}" class="btn mt-3">Back to Products</a>
</div>
{% endblock %}
