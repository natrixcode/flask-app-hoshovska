{% extends "base.html" %}

{% block content %}
<h2>all_products</h2>
<div class="row">
    {% for p in products %}
    <div class="col-md-4 mb-4">
        <div class="card h-100">
            <div class="card-title">{{ p.name }}</div>
            <div class="card-text">
                <p style="color: var(--accent);">${{ p.price }}</p>
                <a href="{{ url_for('products.product_detail', product_id=p.id) }}" class="btn" style="font-size: 12px; padding: 8px 16px;">View Details</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
