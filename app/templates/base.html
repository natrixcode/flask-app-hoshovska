<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Лабораторна №5{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header><nav><a class="logo" href="{{ url_for('main.index') }}">Flask Lab 05</a><div><a href="{{ url_for('main.contact') }}">Контакти</a><a href="{{ url_for('products.list_products') }}">Товари</a><a href="{{ url_for('products.add_product') }}">+ Додати</a></div></nav></header>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}<div role="alert" class="flash {{ category }}">{{ message }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</body></html>
