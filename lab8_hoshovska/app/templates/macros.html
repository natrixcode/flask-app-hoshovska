{% macro render_field(field) %}
<div class="field">
    {{ field.label }} {{ field(class_='control' + (' invalid' if field.errors
    else '')) }} {% if field.errors %}
    <ul class="errors">
        {% for error in field.errors %}
        <li>{{ error }}</li>
        {% endfor %}
    </ul>
    {% endif %}
</div>
{% endmacro %}
